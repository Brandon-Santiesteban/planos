</text><text x="624.2" y="275.5" font-size="12.5" fill="#3d6b2e" text-anchor="start" font-weight="400" >    izquierdo, el lado derecho es jardín</text><text x="624.2" y="294.19999999999993" font-size="12.5" fill="#3d6b2e" text-anchor="start" font-weight="400" >✓ Seto 0,20 × 1,30: izquierda y fondo</text><text x="624.2" y="312.9" font-size="12.5" fill="#3d6b2e" text-anchor="start" font-weight="400" >✓ ⑫ Servicio por el lateral, a la cocina</text><text x="624.2" y="331.59999999999997" font-size="12.5" fill="#3d6b2e" text-anchor="start" font-weight="400" >✓ ⑪ Terraza junto a la doble altura</text><text x="624.2" y="363.8999999999999" font-size="12.5" fill="#c0601c" text-anchor="start" font-weight="700" >Por definir</text><text x="624.2" y="382.59999999999997" font-size="12.5" fill="#c0601c" text-anchor="start" font-weight="400" >• Uso y tamaño de la terraza</text><text x="624.2" y="401.29999999999995" font-size="12.5" fill="#c0601c" text-anchor="start" font-weight="400" >• Escalera: huellas cortas (≈21 cm)</text><text x="624.2" y="420" font-size="12.5" fill="#c0601c" text-anchor="start" font-weight="400" >• Diseño del jardín derecho</text><text x="624.2" y="438.70000000000005" font-size="12.5" fill="#c0601c" text-anchor="start" font-weight="400" >• Puerta principal y fachada</text><text x="624.2" y="471.00000000000006" font-size="11" fill="#7a786d" text-anchor="start" font-weight="400" >Medidas en metros. Esquema, no plano</text><text x="624.2" y="486.3" font-size="11" fill="#7a786d" text-anchor="start" font-weight="400" >constructivo.</text></svg>